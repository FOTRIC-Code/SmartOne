# Parkia.Cube: do NOT run a global DHCP server.
# Stock buildroot/S80 dnsmasq used dhcp-range without bind-interfaces and
# held UDP/67 on all ifaces, so USB RNDIS and SoftAP dedicated instances
# failed with: "failed to bind DHCP server socket: Address already in use".
#
# USB DHCP:   S60netdevice  → dnsmasq -C /tmp/usb_dnsmasq.conf
# SoftAP DHCP: net_app      → dnsmasq -C /tmp/parkia_cube_dnsmasq.conf
#
# Keep a harmless placeholder so S80dnsmasq can start without claiming DHCP.
user=root
port=0
pid-file=/var/run/dnsmasq.pid
